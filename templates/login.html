<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cruise Control — Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .login-card {
            max-width: 380px;
            margin: 8vh auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .login-card h2 { margin: 0 0 1.25rem 0; text-align: center; font-size: 1.5rem; }
        .login-logo { display: block; width: 120px; height: 120px; margin: 0 auto 0.75rem; }
        .login-error {
            color: #b00020;
            margin-bottom: 1rem;
            text-align: center;
        }
        .login-card .form-group { margin-bottom: 1rem; text-align: left; }
        .login-card label { display: block; margin-bottom: 0.35rem; font-weight: 600; text-align: left; }
        .login-card input[type=text], .login-card input[type=password] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: left;
        }
        .login-card button {
            width: 100%;
            padding: 0.6rem 1rem;
            background: #BD9B60;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .login-card button:hover { background: #a0824a; }
    </style>
</head>
<body>
    <div class="login-card">
        <img class="login-logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="">
        <h2>Cruise Control</h2>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
